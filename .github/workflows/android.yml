name: Build Dunbar Caller APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Last pre-A10e layout version: preserve the earlier working build.
          - label: Stable
            ref: 9093ec423050f37d29c571170777dd788893cd64
            artifact: dunbar-caller-working-apk
          # Responsive layout + Android 9 / older WebView compatibility.
          - label: Galaxy A10e
            ref: 19f8e24ea0389e67dbb917e8937c8577487e054c
            artifact: dunbar-caller-galaxy-a10e-apk
    steps:
      - name: Check out selected app version
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
