<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dunbar Caller</title>
<style>
:root{--bg:#070707;--sf:#141414;--s2:#1f1f1f;--tx:#f2f2f2;--mu:#8c8c8c;--ac:#fff;--ax:#000;--me:#262626;--ln:#3c3c3c;--rd:#e5262a;
--dp:'Black Ops One','Oswald','sans-serif-black','sans-serif-condensed',Impact,'Arial Black',sans-serif;--mn:'Share Tech Mono','Roboto Mono',ui-monospace,Menlo,monospace;
--cp:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
[data-t=lite]{--bg:#e6e6e2;--sf:#f7f7f4;--s2:#d6d6d2;--tx:#0c0c0c;--mu:#666;--ac:#0c0c0c;--ax:#fff;--me:#cdcdc8;--ln:#9a9a96}
[data-t=tac]{--bg:#080a06;--sf:#11160d;--s2:#1a2214;--ac:#a6ff4d;--ax:#0a1400;--me:#1c2a10;--ln:#33461f}
[data-t=amber]{--bg:#0a0804;--sf:#16110a;--s2:#211a0e;--ac:#ffa21a;--ax:#1a0f00;--me:#2e1f08;--ln:#4a3410}
[data-t=blood]{--bg:#0a0505;--sf:#150b0b;--s2:#201010;--ac:#ff3030;--ax:#fff;--me:#2e0e0e;--ln:#4d1b1b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:600 15px 'Rajdhani','Roboto Condensed','sans-serif-condensed',system-ui,sans-serif;letter-spacing:.02em}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:150}
body::before{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5))}
body::after{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
[hidden]{display:none!important}
.pg{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.dp,h2{font-family:var(--dp);letter-spacing:.06em;font-weight:400}
button,input{font:inherit;color:var(--tx)}
button{background:var(--s2);border:1px solid var(--ln);clip-path:var(--cp);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:8px 14px}
button:active{background:var(--ac);color:var(--ax)}
input{background:var(--sf);border:1px solid var(--ln);border-radius:0;padding:10px;width:100%;margin:4px 0;font-family:var(--mn);outline:0}
input:focus{border-color:var(--ac)}
.pri{background:var(--ac);color:var(--ax);width:100%;padding:13px;margin-top:8px;border:0}
.mu,small{color:var(--mu);font-family:var(--mn);text-transform:none;letter-spacing:0;font-weight:400}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sf);border-bottom:2px solid var(--ac)}
header b{flex:1;font:400 18px var(--dp);letter-spacing:.14em;text-transform:uppercase}
#list,#msgs{flex:1;overflow:auto;padding:8px 12px}
h4{margin:16px 0 2px;color:var(--mu);font:400 12px var(--mn);letter-spacing:.2em;text-transform:uppercase}
h4::before{content:'// ';color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--sf);border-left:3px solid var(--ac);clip-path:var(--cp);margin:8px 0;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.d{display:inline-block;width:8px;height:8px;background:#555;margin-right:10px;transform:rotate(45deg)}
.d.on{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.b{max-width:82%;background:var(--sf);padding:8px 12px;clip-path:var(--cp);margin:6px 0;word-break:break-word;border-left:3px solid var(--ln)}
.b.me{background:var(--me);margin-left:auto;border-left:0;border-right:3px solid var(--ac)}
.b img{max-width:100%;display:block}
.b small{display:block;font-size:11px}
.b audio{width:100%;margin-top:4px}
.b a{color:var(--ac)}
#bar{display:flex;gap:6px;padding:8px;background:var(--sf);border-top:2px solid var(--ac)}
#bar input{margin:0}
.rec{background:var(--rd)!important;color:#fff}
#sheet,#call{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:5;display:flex;align-items:flex-end}
#sheet>div{background:var(--bg);width:100%;max-height:90%;overflow:auto;padding:16px;border-top:2px solid var(--ac)}
#call{background:#000;align-items:stretch;flex-direction:column;z-index:9;box-shadow:inset 0 0 0 2px var(--ac);color:#fff}
#rv{flex:1;min-height:0;width:100%;object-fit:cover;background:#0b0b0b}
#lv{position:absolute;right:14px;top:14px;width:90px;border:1px solid var(--ac);background:#222}
#ci{position:absolute;top:14px;left:16px;font:14px var(--mn);letter-spacing:.15em;text-transform:uppercase;text-shadow:0 0 6px #000}
#ci::before{content:'\25C9 ';color:var(--rd);animation:bk 1s steps(2) infinite}
#cc{display:flex;justify-content:center;gap:14px;padding:14px;background:#000}
#cc button{width:58px;height:58px;font-size:22px;clip-path:var(--cp);color:#fff}
.red{background:var(--rd)!important}.grn{background:#16a34a!important}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ax);padding:8px 16px;clip-path:var(--cp);z-index:160;font:700 13px var(--mn);letter-spacing:.06em;text-transform:uppercase}
code{background:var(--sf);border:1px dashed var(--ac);padding:8px 10px;display:block;margin:6px 0;user-select:all;word-break:break-all;font-family:var(--mn);letter-spacing:.1em}
#boot{position:fixed;inset:0;background:#000;z-index:200;color:#fff;font:14px var(--mn);padding:24px 22px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;transition:opacity .7s,filter .7s;overflow:hidden}
[data-t=lite] #boot{--ac:#fff;--ax:#000}
#bc{position:absolute;inset:0;width:100%;height:100%;opacity:.4}
#boot .tag{position:absolute;top:calc(16px + env(safe-area-inset-top));left:22px;color:#888;letter-spacing:.2em;font-size:11px}
#boot .tag.r{left:auto;right:22px;color:var(--ac)}
.crn{position:absolute;width:26px;height:26px;border:2px solid var(--ac);z-index:1}
.crn.a{top:calc(40px + env(safe-area-inset-top));left:14px;border-right:0;border-bottom:0}
.crn.b{top:calc(40px + env(safe-area-inset-top));right:14px;border-left:0;border-bottom:0}
.crn.c{bottom:14px;left:14px;border-right:0;border-top:0}
.crn.d{bottom:14px;right:14px;border-left:0;border-top:0}
#bmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 18px 125px}
#radar{position:absolute;width:min(76vw,360px);aspect-ratio:1;border-radius:50%;border:1px solid var(--ac);opacity:.24;background:conic-gradient(from 0deg,transparent 0 78%,var(--ac) 100%);animation:sp 8s linear infinite;box-shadow:0 0 55px var(--wl),inset 0 0 45px var(--wl)}
#radar::before,#radar::after{content:'';position:absolute;border:1px solid var(--ac);border-radius:50%}
#radar::before{inset:20%}#radar::after{inset:40%}
#bh{position:relative;font:clamp(40px,15vw,76px)/.95 var(--dp);margin:0;letter-spacing:.04em;opacity:0}
#bh span{color:var(--ac)}
#bh.hit{opacity:1;animation:slam .9s cubic-bezier(.16,1,.3,1) both}
#bsub{position:relative;opacity:0;letter-spacing:.5em;font-size:11px;color:#aaa;margin-top:14px;transition:opacity .6s}
#bsub.on{opacity:1}
#bl,.pr,.pbar,#bgo{position:relative;z-index:1}
#bl{min-height:150px;line-height:1.6;color:#cfcfcf;font-size:12px}
#bl div::before{content:'> ';color:var(--ac)}
.pr{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;color:#888}
.pbar{height:8px;border:1px solid var(--ac);padding:1px}
.pbar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#bgo{text-align:center;letter-spacing:.3em;animation:bk 1s steps(2) infinite;margin:6px 0 4px}
#fl{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
#fl.on{animation:fa .6s ease-out}
#boot.shk{animation:shk .45s}
#ag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:clamp(26px,9vw,46px) var(--dp);letter-spacing:.1em;background:#0009;color:var(--ac);opacity:0;pointer-events:none;z-index:4}
#ag.on{animation:agk 1s forwards}
@keyframes bk{50%{opacity:0}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes slam{0%{transform:scale(2.2);filter:blur(10px);opacity:0}100%{transform:none;filter:none;opacity:1}}
@keyframes gl{0%,90%,100%{text-shadow:none;transform:none}92%{text-shadow:4px 0 var(--rd),-4px 0 #6cf;transform:translateX(3px)}94%{text-shadow:-4px 0 var(--rd),4px 0 #6cf;transform:translateX(-3px) skewX(6deg)}96%{text-shadow:none;transform:none}}
@keyframes fa{0%{opacity:.9}100%{opacity:0}}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-6px,4px)}40%{transform:translate(5px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}
@keyframes agk{0%{opacity:0}10%{opacity:1}20%{opacity:.2}30%,100%{opacity:1}}
#setup{align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
.sw{width:100%;max-width:420px;padding:22px;background:var(--sf);clip-path:var(--cp);border-left:3px solid var(--ac)}
.sw h2{margin:4px 0 6px;font-size:30px}
.sw label{display:block;margin:14px 0 2px;font:12px var(--mn);letter-spacing:.2em;color:var(--mu);text-transform:uppercase}
.stag{font:12px var(--mn);letter-spacing:.25em;color:var(--ac)}
.un{display:flex;align-items:center}
.avb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--ln);color:var(--ac);flex:none;margin-right:12px;background:var(--s2)}
#ct .avb{width:30px;height:30px;vertical-align:middle}
.avb .av{width:68%;height:68%}
.avb .d{position:absolute;right:-5px;bottom:-5px;margin:0}
.ag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}
.ag button{padding:6px;display:flex;justify-content:center}
.ag .avb{border:0;width:30px;height:30px;margin:0;background:none;color:inherit}
.ag button.sel{background:var(--ac);color:var(--ax)}
#ag{flex-direction:column;gap:10px;text-align:center}
#ag1{font:clamp(22px,7.5vw,38px) var(--dp);letter-spacing:.12em;color:#fff}
#ag2{font:clamp(34px,12vw,64px) var(--dp);letter-spacing:.06em;min-height:1.1em;transform-origin:center}
button.sel{background:var(--ac);color:var(--ax)}
#wr{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.48;pointer-events:none;mix-blend-mode:screen}
.pg{z-index:1}
#wr[data-mono='1']{mix-blend-mode:normal;opacity:.42}
:root{--wl:rgba(255,255,255,.07);--wg:rgba(255,255,255,.16)}
@supports (color:color-mix(in srgb,red,blue)){:root{--wl:color-mix(in srgb,var(--ac) 11%,transparent);--wg:color-mix(in srgb,var(--ac) 24%,transparent)}}
[data-w] body{background-attachment:fixed;background-repeat:no-repeat}
[data-w=nebula] body{background-image:radial-gradient(ellipse at 18% 22%,rgba(88,62,190,.34),transparent 42%),radial-gradient(ellipse at 82% 72%,rgba(0,190,220,.22),transparent 44%),radial-gradient(ellipse at 50% 110%,rgba(190,50,130,.2),transparent 45%),linear-gradient(145deg,#050611,#090b19 55%,#03070d);background-size:160% 160%;animation:nebula 18s ease-in-out infinite alternate}
[data-w=hex] body{background-color:#070d11;background-image:linear-gradient(30deg,var(--wl) 12%,transparent 12.5%,transparent 87%,var(--wl) 87.5%,var(--wl)),linear-gradient(150deg,var(--wl) 12%,transparent 12.5%,transparent 87%,var(--wl) 87.5%,var(--wl)),linear-gradient(30deg,var(--wl) 12%,transparent 12.5%,transparent 87%,var(--wl) 87.5%,var(--wl)),linear-gradient(150deg,var(--wl) 12%,transparent 12.5%,transparent 87%,var(--wl) 87.5%,var(--wl));background-size:54px 94px;background-position:0 0,0 0,27px 47px,27px 47px}
[data-w=circuit] body{background-color:#050a0d;background-image:linear-gradient(90deg,transparent 49%,var(--wl) 50%,transparent 51%),linear-gradient(0deg,transparent 49%,var(--wl) 50%,transparent 51%),linear-gradient(135deg,transparent 48%,var(--wg) 49%,var(--wg) 50%,transparent 51%);background-size:42px 42px,42px 42px,84px 84px}
[data-w=singularity] body{background-image:radial-gradient(circle at 50% 42%,transparent 0 8%,rgba(0,0,0,.9) 8.5% 13%,transparent 13.5%),repeating-radial-gradient(ellipse at 50% 42%,transparent 0 26px,var(--wl) 27px 28px),radial-gradient(ellipse at 50% 42%,var(--wg),transparent 58%),linear-gradient(#03050a,#090b16)}
[data-w=aurora] body{background-image:radial-gradient(ellipse at 10% 20%,rgba(20,255,180,.22),transparent 40%),radial-gradient(ellipse at 80% 35%,rgba(70,120,255,.25),transparent 42%),radial-gradient(ellipse at 50% 100%,rgba(180,60,255,.2),transparent 48%),linear-gradient(160deg,#03080d,#080718);background-size:200% 200%;animation:aur 14s ease-in-out infinite alternate}
[data-w=grid] body{background-image:linear-gradient(var(--wl) 1px,transparent 1px),linear-gradient(90deg,var(--wl) 1px,transparent 1px);background-size:34px 34px}
[data-w=starfield] body{background-color:#03050b;background-image:radial-gradient(1px 1px at 10% 20%,#fff 99%,transparent),radial-gradient(2px 2px at 80% 30%,var(--ac) 99%,transparent),radial-gradient(1px 1px at 40% 70%,#fff 99%,transparent),radial-gradient(1px 1px at 70% 85%,#fff 99%,transparent),radial-gradient(2px 2px at 22% 88%,var(--ac) 99%,transparent),radial-gradient(ellipse at 50% 0%,var(--wg),transparent 60%);background-size:180px 180px,230px 230px,140px 140px,190px 190px,260px 260px,100% 100%}
[data-w=prism] body{background-image:linear-gradient(125deg,transparent 0 30%,rgba(0,220,255,.12) 30.2% 30.8%,transparent 31%),linear-gradient(35deg,transparent 0 54%,rgba(170,80,255,.16) 54.2% 55%,transparent 55.2%),radial-gradient(ellipse at 85% 10%,var(--wg),transparent 45%),linear-gradient(145deg,#05070d,#101020 60%,#060912)}
[data-w=scan] body{background-color:#05090b;background-image:repeating-linear-gradient(0deg,transparent 0 5px,var(--wl) 6px 7px),linear-gradient(90deg,transparent 49.8%,var(--wg) 50%,transparent 50.2%),radial-gradient(ellipse at 50% 0%,var(--wg),transparent 65%)}
@keyframes nebula{to{background-position:100% 80%,0 100%,70% 0,0 0}}@keyframes aur{to{background-position:100% 100%,0 100%,100% 0,0 0}}

/* Wallpaper layer: intentionally visible behind the interface on mobile and desktop */
html[data-w] body{
  background-color:var(--bg)!important;
  background-attachment:scroll!important;
  background-repeat:repeat!important;
  background-blend-mode:screen,normal;
}
html[data-w=nebula] body{
  background-image:
    radial-gradient(ellipse at 15% 18%,rgba(117,73,255,.42),transparent 43%),
    radial-gradient(ellipse at 82% 68%,rgba(0,210,255,.30),transparent 43%),
    radial-gradient(ellipse at 55% 105%,rgba(255,48,166,.22),transparent 45%),
    linear-gradient(145deg,#050611,#090b19 55%,#03070d)!important;
  background-size:160% 160%,160% 160%,160% 160%,cover!important;
}
html[data-w=aurora] body{
  background-image:
    radial-gradient(ellipse at 10% 22%,rgba(20,255,180,.34),transparent 42%),

html[data-w=starfield] body{

    radial-gradient(2px 2px at 22% 88%,var(--ac) 99%,transparent),

  background-size:180px 180px,230px 230px,140px 140px,190px 190px,260px 260px,cover,cover!important;

html[data-w=prism] body{

    linear-gradient(145deg,#05070d,#101020 60%,#060912)!important;
  background-size:cover!important;

  background-image:
    linear-gradient(90deg,transparent 48%,rgba(0,220,255,.16) 50%,transparent 52%),
    linear-gradient(0deg,transparent 48%,rgba(0,220,255,.13) 50%,transparent 52%),
    linear-gradient(135deg,transparent 47%,rgba(0,220,255,.20) 49%,rgba(0,220,255,.20) 50%,transparent 52%),
    linear-gradient(145deg,#050a0d,#07141a)!important;
  background-size:42px 42px,42px 42px,84px 84px,cover!important;

  background-color:#070d11!important;
  background-image:
    linear-gradient(30deg,rgba(0,220,255,.15) 12%,transparent 12.5%,transparent 87%,rgba(0,220,255,.15) 87.5%,rgba(0,220,255,.15)),
    linear-gradient(150deg,rgba(0,220,255,.15) 12%,transparent 12.5%,transparent 87%,rgba(0,220,255,.15) 87.5%,rgba(0,220,255,.15)),
    linear-gradient(30deg,rgba(0,220,255,.15) 12%,transparent 12.5%,transparent 87%,rgba(0,220,255,.15) 87.5%,rgba(0,220,255,.15)),
    linear-gradient(150deg,rgba(0,220,255,.15) 12%,transparent 12.5%,transparent 87%,rgba(0,220,255,.15) 87.5%,rgba(0,220,255,.15)),
    linear-gradient(#070d11,#09131a)!important;

    linear-gradient(#05090b,#081116)!important;

/* The live canvas is the wallpaper; disable legacy static CSS layers so palettes never clash. */
html[data-w] body{background-image:none!important}
[data-t=ice]{--bg:#05090c;--sf:#0c151a;--s2:#13222a;--ac:#3de0ff;--ax:#001418;--me:#0f2a33;--ln:#1d4552}
[data-t=violet]{--bg:#07050b;--sf:#120d1a;--s2:#1b1428;--ac:#b57cff;--ax:#14002b;--me:#231838;--ln:#3d2a5c}
[data-t=pink]{--bg:#0b0509;--sf:#1a0c14;--s2:#26121d;--ac:#ff4fd8;--ax:#2a0022;--me:#36122f;--ln:#5c2150}
[data-t=gold]{--bg:#0a0903;--sf:#171409;--s2:#221d0d;--ac:#ffd23d;--ax:#1c1500;--me:#2e2709;--ln:#4d4214}
[data-t=mint]{--bg:#040b08;--sf:#0a1712;--s2:#10241b;--ac:#2bffb0;--ax:#00241a;--me:#0e2e22;--ln:#1a5240}
#nb{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:170;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.nc{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--sf);border-left:3px solid var(--ac);clip-path:var(--cp);padding:10px 12px;animation:ni .3s ease-out}
.nc.vm{border-left-color:var(--rd)}
.nc b{display:block;font:700 12px var(--mn);letter-spacing:.15em;color:var(--ac)}
.nc.vm b{color:var(--rd)}
.nc small{display:block;color:var(--tx)}
.bg{background:var(--ac);color:var(--ax);min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font:700 12px var(--mn);padding:0 6px;clip-path:var(--cp);letter-spacing:0}
@keyframes ni{from{transform:translateY(-130%);opacity:0}}
.tp{flex:1;overflow:auto;padding:8px 12px}

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('bc'))}catch(e){}
S=S||{me:null,friends:{},groups:{},msgs:{},pend:{}};S.un=S.un||{};S.dq=S.dq||{};
const save=()=>{try{localStorage.setItem('bc',JSON.stringify(S))}catch(e){toast('Storage full, media not saved')}};
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2800)}
const nm=id=>S.me&&id===S.me.id?'Me':(S.friends[id]?S.friends[id].name:id);
const rd=(b,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(b)};
let peer,conns={},cur=null,call=null,ls=null,linked=false;

function setup0(){const n=$('#sn').value.trim(),b=$('#sb').value.trim();if(!n)return toast('Enter a username');if(b.replace(/\D/g,'').length<7)return toast('Enter your burner number');tone(440,.1,'square',.05);tone(880,.25,'square',.05,.1);
 S.me={id:'bc'+Math.random().toString(36).slice(2,10),name:n,burner:$('#sb').value.trim(),av:AVSEL,cl:CLSEL};save();boot()}
function boot(){$('#setup').hidden=!!S.me;$('#home').hidden=!S.me;if(!S.me)return;
 $('#code').textContent=S.me.id;$('#pn').value=S.me.name;AVSEL=S.me.av|0;CLSEL=S.me.cl|0;apUI();$('#pb').value=S.me.burner||'';start();render()}
function saveProf(){S.me.name=$('#pn').value.trim()||S.me.name;S.me.burner=$('#pb').value.trim();S.me.av=AVSEL;S.me.cl=CLSEL;regSelf();save();
 Object.keys(conns).forEach(i=>sendTo(i,{t:'hi',name:S.me.name,burner:S.me.burner,av:S.me.av|0,cl:S.me.cl|0}));render();toast('Saved')}

const PEER_OPTIONS=()=>({host:'dunbar-caller-signaling.onrender.com',port:443,path:'/peerjs',secure:true,debug:1});
function start(){
 peer=new Peer(S.me.id,PEER_OPTIONS());
 peer.on('open',()=>{$('#dot').classList.add('on');Object.keys(S.friends).forEach(connect)});
 peer.on('disconnected',()=>{$('#dot').classList.remove('on');setTimeout(()=>peer.reconnect(),3000)});
 peer.on('error',e=>{if(e.type==='network'||e.type==='server-error')setTimeout(()=>peer.reconnect(),4000)});
 peer.on('connection',setupConn);peer.on('call',onCall);
 setInterval(()=>Object.keys(S.friends).forEach(connect),20000);joinDir();
}
function connect(id){if(!peer||!peer.open||(conns[id]&&conns[id].open))return;setupConn(peer.connect(id,{reliable:true}))}
function setupConn(c){
 c.on('open',()=>{conns[c.peer]=c;c.send({t:'hi',name:S.me.name,burner:S.me.burner,av:S.me.av|0,cl:S.me.cl|0});
  const f=S.friends[c.peer];if(f&&!f.ok)c.send({t:'req',name:S.me.name,burner:S.me.burner,av:S.me.av|0,cl:S.me.cl|0});flush(c.peer);if(S.dq[c.peer]){c.send({t:'dec'});delete S.dq[c.peer];save()}render()});
 c.on('data',d=>recv(c.peer,d));
 c.on('close',()=>{if(conns[c.peer]===c){delete conns[c.peer];render()}});
}
function sendTo(id,d){const c=conns[id];if(c&&c.open){c.send(d);return true}connect(id);return false}
function flush(id){const c=conns[id];if(!c)return;let ch=0;
 (S.msgs[id]||[]).forEach(m=>{if(m.q&&m.from==='me'){c.send({t:'m',m:{...m,q:0}});delete m.q;ch=1}});if(ch){save();if(cur===id)openChat(id)}}

function addId(id){const u=dirList.find(x=>x.id===id);if(!S.friends[id])S.friends[id]={name:u?u.name:id,av:u?u.av:0,cl:u?u.cl|0:0,ok:false};save();connect(id);render();toast('Request sent')}
function addFriend(){const id=$('#fc').value.trim();if(!/^bc[a-z0-9]{8}$/.test(id)||id===S.me.id)return toast('Invalid code');addId(id);$('#fc').value=''}
function acc(id){S.friends[id]={name:S.pend[id],ok:true,burner:(S.friends[id]||{}).burner,av:(dirList.find(x=>x.id===id)||{}).av|0,cl:(dirList.find(x=>x.id===id)||{}).cl|0};delete S.pend[id];save();sendTo(id,{t:'acc',name:S.me.name,burner:S.me.burner,av:S.me.av|0,cl:S.me.cl|0});connect(id);render()}
function dec(id){delete S.pend[id];if(!sendTo(id,{t:'dec'}))S.dq[id]=1;save();render()}

const TYPES=['text','img','gif','file','vm'];
function recv(id,d){
 if(!d||typeof d!=='object')return;const f=S.friends[id];
 if(d.t==='hi'){if(f&&f.ok){f.name=String(d.name).slice(0,40);f.burner=String(d.burner||'').slice(0,20);f.av=Math.max(0,Math.min(+d.av|0,EM.length-1));f.cl=Math.max(0,Math.min(+d.cl|0,PAL.length-1));save();render()}}
 else if(d.t==='req'){const n=String(d.name).slice(0,40);if(S.dq[id])return;
  if(f){f.ok=true;f.name=n;f.burner=String(d.burner||'').slice(0,20);f.av=Math.max(0,Math.min(+d.av|0,EM.length-1));f.cl=Math.max(0,Math.min(+d.cl|0,PAL.length-1));sendTo(id,{t:'acc',name:S.me.name,burner:S.me.burner,av:S.me.av|0,cl:S.me.cl|0})}else{S.pend[id]=n;ban(0,'FRIEND REQUEST',n+' wants to connect',()=>tab('reqs'));tone(900,.08,'square',.05);tone(1200,.1,'square',.05,.1)}save();render()}
 else if(d.t==='dec'&&f&&!f.ok){ban(f.av,'REQUEST DECLINED',f.name+' declined your request',null,0,f.cl);tone(300,.25,'square',.06);delete S.friends[id];save();render()}
 else if(d.t==='acc'&&f){if(!f.ok){ban(f.av,'REQUEST ACCEPTED',String(d.name).slice(0,40)+' is now your friend',()=>tab('list'),0,f.cl);tone(700,.08,'square',.05);tone(1000,.12,'square',.05,.1)}f.ok=true;f.name=String(d.name).slice(0,40);f.burner=String(d.burner||'').slice(0,20);f.av=Math.max(0,Math.min(+d.av|0,EM.length-1));f.cl=Math.max(0,Math.min(+d.cl|0,PAL.length-1));save();render()}
 else if(d.t==='m'&&f&&f.ok&&d.m){const m=d.m;
  if(!TYPES.includes(m.type)||(m.data&&!/^(data:|https:\/\/)/.test(m.data))||(m.type==='file'&&m.data&&!m.data.startsWith('data:')))return;
  let k=id;if(m.g){if(!/^g[a-z0-9]+$/.test(m.g))return;
   if(!S.groups[m.g])S.groups[m.g]={name:String(m.gn).slice(0,40),members:(m.gm||[]).filter(x=>x!==S.me.id)};k=m.g}
  const c={id:m.id,type:m.type,text:String(m.text||'').slice(0,4000),data:m.data,name:String(m.name||'file').slice(0,80),dur:Number(m.dur)||0,ts:m.ts||Date.now(),from:id};
  (S.msgs[k]=S.msgs[k]||[]).push(c);save();
  if(cur===k&&!document.hidden)openChat(k);else{ntf(k,c);if(cur===k)openChat(k);else render()}}
}

function send(m){m.id=Date.now()+Math.random().toString(36).slice(2,6);m.ts=Date.now();m.from='me';const k=cur,g=S.groups[k];
 if(g){const w={...m,g:k,gn:g.name,gm:[...g.members,S.me.id]};g.members.forEach(i=>sendTo(i,{t:'m',m:w}))}
 else if(!sendTo(k,{t:'m',m:{...m}}))m.q=1;
 (S.msgs[k]=S.msgs[k]||[]).push(m);save();openChat(k)}
function sendText(){const v=$('#mi').value.trim();if(!v)return;$('#mi').value='';send({type:'text',text:v})}
$('#mi').addEventListener('keydown',e=>{if(e.key==='Enter')sendText()});
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>2.5e6)return toast('Max 2.5 MB per file');
 rd(f,u=>send({type:f.type==='image/gif'?'gif':f.type.startsWith('image/')?'img':'file',data:u,name:f.name}))};
function gif(){const u=prompt('Paste a GIF link (https://...)');if(u&&/^https:\/\//.test(u))send({type:'gif',data:u.trim()})}

let rec,chunks;
async function vm(){if(rec&&rec.state==='recording'){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const t0=Date.now();chunks=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());$('#mic').classList.remove('rec');
   const b=new Blob(chunks,{type:rec.mimeType});if(b.size>2.5e6)return toast('Voicemail too long');rd(b,u=>send({type:'vm',data:u,dur:Math.round((Date.now()-t0)/1000)}))};
  rec.start();$('#mic').classList.add('rec');toast('Recording... tap 🎙 to send')}catch(e){toast('Mic blocked')}}

function pv(m){return m.type==='text'?m.text:m.type==='vm'?'🎙 Voicemail':m.type==='file'?'📎 '+m.name:'🖼 Photo'}
function avb(i,on,cl){return `<span class="avb" style="color:${PAL[cl|0]||PAL[0]}"><svg class="av" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">${EM[i|0]||EM[0]}</svg>${on===undefined?'':`<i class="d ${on?'on':''}"></i>`}</span>`}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'}
function render(){
 const row=(k,name,on,sub,ph,av,cl)=>{const l=(S.msgs[k]||[]).slice(-1)[0];
  return `<div class="row" onclick="openChat('${k}')"><span class="un">${avb(av,on,cl)}<span>${esc(name)}${ph?' ☎':''}<br><small>${esc(sub||(l?pv(l).slice(0,40):''))}</small></span></span>${S.un[k]?`<b class="bg">${S.un[k]}</b>`:''}</div>`};
 let h='';const gs=Object.entries(S.groups),fs=Object.entries(S.friends).filter(([k,f])=>f.ok);
 if(gs.length)h+='<h4>Groups</h4>'+gs.map(([k,g])=>row(k,g.name,undefined,g.members.length+1+' members',0,3,0)).join('');
 h+='<h4>Friends</h4>'+(fs.length?fs.map(([k,f])=>row(k,f.name,!!(conns[k]&&conns[k].open),'',f.burner,f.av,f.cl)).join(''):'<p class="mu">Tap ＋ to see who is online and send a friend request.</p>');
 $('#list').innerHTML=h;
 const rq=Object.entries(S.pend),sent=Object.entries(S.friends).filter(([k,f])=>!f.ok);
 let r=rq.length?'<h4>Incoming</h4>'+rq.map(([i,n])=>{const u=dirList.find(x=>x.id===i)||{};return `<div class="row"><span class="un">${avb(u.av,undefined,u.cl)}${esc(n)}</span><span><button class="ok" onclick="acc('${i}')">✓</button> <button class="no" onclick="dec('${i}')">✕</button></span></div>`}).join(''):'<p class="mu">No friend requests right now.</p>';
 if(sent.length)r+='<h4>Sent</h4>'+sent.map(([i,f])=>`<div class="row"><span class="un">${avb(f.av,undefined,f.cl)}${esc(f.name)}</span><small>WAITING</small></div>`).join('');
 $('#reqs').innerHTML=r;
 const vl=[];Object.entries(S.msgs).forEach(([k,a])=>a.forEach(m=>{if(m.type==='vm'&&m.from!=='me')vl.push([k,m])}));vl.sort((a,b)=>b[1].ts-a[1].ts);
 const nvm=TAB==='vms'?0:vl.filter(([k,m])=>m.ts>(S.vs||0)).length;
 $('#vms').innerHTML=vl.length?vl.map(([k,m])=>{const f=S.friends[m.from]||{};return `<div class="row vr"><span class="un" onclick="openChat('${k}')">${avb(f.av,undefined,f.cl)}<span>${esc(f.name||m.from)}<br><small>${m.dur}s · ${ago(m.ts)}${S.groups[k]?' · '+esc(S.groups[k].name):''}</small></span></span><audio controls src="${esc(m.data)}"></audio></div>`}).join(''):'<p class="mu">No voicemails yet. Friends can leave one with the 🎙 button in a chat.</p>';
 const tu=Object.values(S.un).reduce((a,b)=>a+b,0);
 $('#tabs').innerHTML=[['list','CHATS',tu],['reqs','REQUESTS',rq.length],['vms','VOICEMAIL',nvm],['setp','SETTINGS',0]].map(([k,l,n])=>`<button class="${k===TAB?'sel':''}" onclick="tab('${k}')">${l}${n?` <span class="bg">${n}</span>`:''}</button>`).join('');
 $('#gm').innerHTML=fs.map(([k,f])=>`<label style="display:block;padding:4px"><input type="checkbox" value="${k}" style="width:auto;margin-right:8px">${esc(f.name)}</label>`).join('');
 const o=dirList.filter(u=>u.id!==S.me.id);
 $('#on').innerHTML=o.length?o.map(u=>{const f=S.friends[u.id];
  const b=S.pend[u.id]?`<button class="ok" onclick="acc('${u.id}')">✓</button>`:f?`<small>${f.ok?'FRIEND':'REQUEST SENT'}</small>`:`<button class="sm" onclick="addId('${u.id}')">SEND FRIEND REQUEST</button>`;
  return `<div class="row"><span class="un">${avb(u.av,1,u.cl)}${esc(u.name)}</span>${b}</div>`}).join(''):'<p class="mu">Nobody else is online yet. Ask your friends to open the app.</p>'}
function mkGroup(){const n=$('#gn').value.trim();const ms=[...document.querySelectorAll('#gm input:checked')].map(i=>i.value);
 if(!n||!ms.length)return toast('Name + at least 1 friend');
 const id='g'+Math.random().toString(36).slice(2,10);S.groups[id]={name:n,members:ms};save();$('#gn').value='';sheet(0);render();
 cur=id;send({type:'text',text:'Group created'})}
function sheet(o){$('#sheet').hidden=!o;if(o){render();thUI();wpUI()}}

function bub(m){const me=m.from==='me';let c;
 if(m.type==='img'||m.type==='gif')c=`<img src="${esc(m.data)}">`;
 else if(m.type==='vm')c=`🎙 Voicemail (${m.dur}s)<audio controls src="${esc(m.data)}"></audio>`;
